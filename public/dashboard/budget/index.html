<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/dashboard/trading/trading.css">
  <link rel="stylesheet" href="/dashboard/budget/budget.css">
  <script src="/assets/theme.js"></script>
  <title>Budget</title>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="/dashboard/" aria-label="Back to dashboard">‹</a>
      <div class="brand"><div class="brand-mark">N</div><div class="brand-name">Budget</div></div>
      <div class="spacer"></div>
      <button class="ghost icon theme-btn" type="button"></button>
    </div>
  </header>

  <main class="trd">
    <div class="trd-head">
      <div class="month-nav">
        <button class="ghost icon" id="prev" type="button" aria-label="Previous month">‹</button>
        <div class="month" id="month">…</div>
        <button class="ghost icon" id="next" type="button" aria-label="Next month">›</button>
      </div>
      <div class="sync-row">
        <span class="muted small" id="synced"></span>
        <button class="ghost icon" id="sync" type="button">Sync now</button>
      </div>
    </div>

    <div class="banner err" id="err" hidden></div>
    <div class="banner ok-b" id="okmsg" hidden></div>

    <div class="tiles">
      <div class="tile"><div class="k">Money in</div><div class="v up" id="t-in">–</div><div class="s">salary &amp; other income</div></div>
      <div class="tile"><div class="k">Spent</div><div class="v" id="t-out">–</div><div class="s" id="t-out-s">bills &amp; spending</div></div>
      <div class="tile"><div class="k">Left</div><div class="v" id="t-left">–</div><div class="s">in minus spent</div></div>
      <div class="tile"><div class="k">Budget used</div><div class="v" id="t-bud">–</div><div class="s" id="t-bud-s">set limits below</div></div>
    </div>

    <div class="two">
      <section class="card">
        <h3>Where it went <button class="link small" id="edit-budgets" type="button" style="float:right">Set budgets</button></h3>
        <div id="cats"></div>
      </section>
      <section class="card">
        <h3>Bank accounts</h3>
        <div id="banks"></div>
        <form id="connect" class="connect">
          <input id="bank-search" list="bank-list" placeholder="Search for your bank, e.g. Monzo" autocomplete="off">
          <datalist id="bank-list"></datalist>
          <button type="submit">Connect</button>
        </form>
        <p class="muted small" style="margin:8px 0 0">Read-only access through Open Banking (Enable Banking). Banks ask you to re-approve every 90–180 days.</p>
      </section>
    </div>

    <section class="card">
      <h3>Transactions</h3>
      <div class="tx-tools">
        <input id="q" placeholder="Search" autocomplete="off">
        <select id="f-cat"><option value="">All categories</option></select>
      </div>
      <div id="txs"></div>
    </section>
  </main>

  <dialog id="dlg" class="dlg"></dialog>
  <script src="/dashboard/budget/budget.js" type="module"></script>
</body>
</html>
