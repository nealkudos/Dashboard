<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/vendor/gridstack.min.css">
  <link rel="stylesheet" href="/assets/app.css?v=1793231144">
  <script src="/assets/theme.js?v=1793231144"></script>
  <title>Dashboard</title>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><div class="brand-mark">N</div><div class="brand-name">Dashboard</div></div>
      <div class="spacer"></div>
      <button class="ghost icon theme-btn" type="button"></button>
      <div class="menu">
        <button class="ghost icon" id="menu-btn" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
        <div class="menu-panel" id="menu" hidden>
          <div class="note" id="rotate-note"></div>
          <button id="m-edit">Edit layout</button>
          <button id="m-rotate">Change password &amp; authenticator now</button>
          <div class="sep"></div>
          <button id="m-logout">Sign out</button>
          <button id="m-logout-all">Sign out on all devices</button>
        </div>
      </div>
    </div>
  </header>

  <div class="banner" id="flash" hidden></div>

  <main class="dash">
    <div class="grid-stack" id="grid"></div>
  </main>

  <div class="editbar" id="editbar" hidden>
    <span>Drag a block by its title · drag a corner to resize</span>
    <button class="ghost" id="e-reset" type="button">Reset</button>
    <button id="e-done" type="button">Done</button>
  </div>

  <script src="/assets/vendor/gridstack-all.js"></script>
  <script src="/dashboard/app.js" type="module"></script>
</body>
</html>
