<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lean 12">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/app.css?v=1795100000">
  <link rel="stylesheet" href="/dashboard/budget/budget.css?v=1795100000">
  <link rel="stylesheet" href="/dashboard/lean/lean.css?v=1795100000">
  <script src="/assets/theme.js?v=1795100000"></script>
  <title>Lean 12</title>
</head>
<body class="bapp">
  <header class="top">
    <div class="top-inner">
      <a class="back" href="/dashboard/" aria-label="Back">‹</a>
      <div class="brand"><div class="brand-mark">N</div><div class="brand-name">Lean 12</div></div>
      <div class="spacer"></div>
      <button class="ghost icon theme-btn" type="button"></button>
      <button class="ghost icon" id="settings" type="button" aria-label="Programme settings" hidden>⚙︎</button>
    </div>
  </header>

  <main class="app">
    <div class="note err" id="err" hidden></div>
    <div class="note ok" id="okmsg" hidden></div>
    <div id="loading" class="muted" style="text-align:center;padding:40px 0">Loading…</div>

    <section id="welcome" hidden></section>

    <section id="tab-today" hidden></section>
    <section id="tab-progress" hidden></section>
    <section id="tab-workouts" hidden></section>
    <section id="tab-plan" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="today" class="on" type="button"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></span>Today</button>
    <button data-tab="progress" type="button"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/></svg></span>Progress</button>
    <button data-tab="workouts" type="button"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>Workouts</button>
    <button data-tab="plan" type="button"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Plan</button>
  </nav>

  <dialog id="dlg" class="sheet"></dialog>
  <script src="/dashboard/lean/lean.js?v=1795100000" type="module"></script>
</body>
</html>
