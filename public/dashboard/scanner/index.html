<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/dashboard/trading/trading.css">
  <link rel="stylesheet" href="/dashboard/scanner/scanner.css">
  <script src="/assets/theme.js"></script>
  <title>Chart scanner</title>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="/dashboard/" aria-label="Back to dashboard">‹</a>
      <div class="brand"><div class="brand-mark">N</div><div class="brand-name">Chart scanner</div></div>
      <div class="spacer"></div>
      <a class="ghost icon btn navbtn" href="/dashboard/trading/">Trading</a>
      <button class="ghost icon theme-btn" type="button"></button>
    </div>
  </header>

  <main class="trd">
    <div class="banner err" id="err" hidden></div>

    <section class="bias card" id="bias">
      <div class="muted small">XAUUSD · loading…</div>
    </section>

    <section class="card">
      <h3>Trend by timeframe <span class="muted small">· EMA 50 vs EMA 200</span></h3>
      <div class="tfs" id="tfs"></div>
      <p class="muted small rule">Up = EMA50 above EMA200 and price above EMA200. Down = the opposite. Anything else is mixed.
        The EMA 50/200 strategy only trades when all three agree.</p>
    </section>

    <section class="card">
      <h3>Signals</h3>
      <div id="signals"></div>
    </section>

    <section class="card">
      <h3>Setups <span class="muted small" id="range"></span></h3>
      <div id="setups"></div>
    </section>

    <div class="muted small foot" id="updated"></div>
  </main>

  <script src="/dashboard/scanner/scanner.js" type="module"></script>
</body>
</html>
