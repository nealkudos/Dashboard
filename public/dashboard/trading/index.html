<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/app.css?v=1793230276">
  <link rel="stylesheet" href="/dashboard/trading/trading.css">
  <script src="/assets/theme.js?v=1793230276"></script>
  <title>Trading</title>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="back" href="/dashboard/" aria-label="Back to dashboard">‹</a>
      <div class="brand"><div class="brand-mark">N</div><div class="brand-name">Trading</div></div>
      <div class="spacer"></div>
      <button class="ghost icon theme-btn" type="button"></button>
    </div>
  </header>

  <main class="trd">
    <div class="trd-head">
      <div>
        <div class="muted small" id="acct">Loading…</div>
        <div class="pills" id="pills"></div>
      </div>
      <div class="seg" id="period" role="tablist">
        <button data-d="1" type="button">Today</button><button data-d="7" type="button" class="on">7 days</button><button data-d="30" type="button">30 days</button><button data-d="90" type="button">90 days</button>
      </div>
    </div>

    <div class="banner err" id="err" hidden></div>

    <section class="card live" id="live">
      <div class="live-head">
        <h3><span class="dot" id="liveDot"></span> Live</h3>
        <div class="px"><span class="muted small">Gold</span> <b id="px">—</b> <span id="pxMove" class="small"></span></div>
      </div>
      <div id="liveOpen"><div class="empty">Loading…</div></div>
      <div id="livePend"></div>
      <div class="muted small" id="liveAge"></div>
    </section>

    <div class="tiles" id="tiles"></div>

    <div class="two">
      <section class="card"><h3 id="curveTitle">Profit over time</h3><div id="curve"></div></section>
      <section class="card"><h3>Profit by day</h3><div id="daily"></div></section>
    </div>

    <section class="card"><h3>By source</h3><div id="sources"></div></section>
    <section class="card">
      <h3>Closed trades</h3>
      <div class="chips" id="chips"></div>
      <div id="trades"></div>
    </section>

    <div class="muted small foot" id="updated"></div>
  </main>

  <script src="/dashboard/trading/trading.js" type="module"></script>
</body>
</html>
